# Data product template (Open Data Product Standard, bitol.io/odps/v1alpha1).
# Validate against ../schemas/odps-data-product.schema.json
# Normally generated by governance_core/generate_odps_product.py, which groups
# one or more data-contract.template.yaml-shaped contracts into a single
# consumable Gold Enterprise Data Product descriptor.

apiVersion: "bitol.io/odps/v1alpha1"
kind: "DataProduct"

id: "urn:ent:domain:procurement:dataproduct:supplier_lead_time_performance"
name: "Supplier Lead Time Performance"
description: >
  Gold-tier, source-agnostic view of supplier lead time performance across
  assembly facilities. Backed by the factory_lead_times data contract.
status: "active"
version: "1.0.0"
domain: "procurement"
tier: "gold"

owner:
  name: "{{data_owner_name}}"
  email: "{{data_owner_email}}"

outputPorts:
  - id: "factory_lead_times_gold"
    name: "Factory Lead Times (Gold)"
    contractId: "urn:ent:domain:procurement:product:factory_lead_times"
    type: "table"
    platform: "databricks"
    location: "main.procurement_gold.factory_lead_times"

consumptionChannels:
  - name: "Procurement Executive Dashboard"
    type: "dashboard"

slaRefs:
  - "urn:ent:domain:procurement:product:factory_lead_times#service_level_agreement"

supportChannel: "#help-procurement-data"
